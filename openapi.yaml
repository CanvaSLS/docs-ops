        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      parameters:
      - name: curso_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              titulo: 'Módulo 7: Observabilidad'
