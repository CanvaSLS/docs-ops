      description: ms-cursos
    post:
      tags:
      - ms-cursos
      summary: Crear curso
      operationId: crearCurso
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              codigo: CS2032
              nombre: Computación en la Nube
  /cursos/{curso_id}:
    put:
      tags:
      - ms-cursos
      summary: Modificar curso
      operationId: modificarCurso
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      parameters:
      - name: curso_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              nombre: Computación en la Nube (2026-2)
    servers:
    - url: https://api.invalid/cursos
      description: ms-cursos
    delete:
      tags:
      - ms-cursos
      summary: Eliminar curso
      operationId: eliminarCurso
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      parameters:
      - name: curso_id
        in: path
        required: true
        schema:
          type: string
