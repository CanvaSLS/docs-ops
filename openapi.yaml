openapi: 3.0.3
info:
  title: StudyPulse · CanvaSLS API
  version: 1.0.0
  description: '6 microservicios serverless (un API Gateway cada uno). Pulsa **Authorize**,
    pega el `token` de /auth/login y prueba. El tenant NUNCA se envía: sale del token
    (Lambda Authorizer). Credenciales demo: profe@utec.edu.pe / Demo2026!'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
paths:
  /auth/registro:
    post:
      tags:
      - ms-auth
      summary: Registrar usuario (alumno/docente) en un tenant
      operationId: registro
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              tenant_id: UTEC
              email: nuevo@utec.edu.pe
              nombre: Nuevo Alumno
              password: ClaveSegura1
              rol: alumno
    servers:
    - url: https://api.invalid/auth
      description: ms-auth
  /auth/login:
    post:
      tags:
      - ms-auth
      summary: Iniciar sesión → token con TTL
      operationId: login
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              tenant_id: UTEC
              email: profe@utec.edu.pe
              password: Demo2026!
    servers:
    - url: https://api.invalid/auth
      description: ms-auth
  /auth/me:
    get:
      tags:
      - ms-auth
      summary: Identidad del token
      operationId: me
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    servers:
    - url: https://api.invalid/auth
      description: ms-auth
  /auth/usuarios:
    get:
      tags:
      - ms-auth
      summary: Listar usuarios del tenant (paginado)
      operationId: listarUsuarios
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    servers:
    - url: https://api.invalid/auth
      description: ms-auth
  /cursos:
    get:
      tags:
      - ms-cursos
      summary: Listar cursos según rol
      operationId: listarCursos
      responses:
        '200':
          description: OK
        '400':
