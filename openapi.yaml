      operationId: listarModulos
      responses:
        '200':
          description: OK
        '400':
          description: Validación
        '401':
          description: Token ausente/inválido/expirado
        '403':
          description: Rol, tenant o prefijo no autorizado
        '404':
          description: No existe en tu tenant
      security:
      - bearer: []
      parameters:
      - name: curso_id
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    servers:
    - url: https://api.invalid/cursos
      description: ms-cursos
    post:
      tags:
